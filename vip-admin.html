<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a08">
<title>Admin Lista VIP | ADR Nutra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a08;--card:#16130f;--line:#2e2921;--tx:#f3efe6;--mut:#a69c8a;--gold:#c99a4e;--gold2:#e6be78}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(70% 40% at 50% 0,#c99a4e1f,transparent 70%),var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:760px;margin:0 auto;padding:24px 16px 40px}
.hidden{display:none!important}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0}
.logo{font:700 20px "Space Grotesk",sans-serif;letter-spacing:.06em;border:1.5px solid #cfcfd3;padding:1px 10px 2px}
input,select,button{font:inherit}
.btn{background:var(--gold);color:#0e0d0b;border:0;border-radius:10px;padding:12px 18px;font:600 15px "Space Grotesk",sans-serif;cursor:pointer}
.btn:hover{background:var(--gold2)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 13px;cursor:pointer;font-size:13.5px}
.ghost:hover{border-color:var(--gold)}
/* login */
#login{min-height:86vh;display:flex;align-items:center;justify-content:center}
.lg{width:100%;max-width:360px;background:var(--card);border:1px solid #c99a4e55;border-radius:18px;padding:28px 22px;text-align:center}
.lg .logo{display:inline-block;margin-bottom:14px}
.lg h1{font-size:21px;margin-bottom:4px}.lg p{color:var(--mut);margin:0 0 18px;font-size:14px}
.lg input{width:100%;background:#0b0a08;border:1px solid var(--line);color:var(--tx);padding:13px 14px;border-radius:10px;font-size:16px;outline:none;margin-bottom:12px}
.lg input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c99a4e33}
.lg .btn{width:100%}
.lg .er{color:#ff8a7a;font-size:13px;min-height:20px;margin:10px 0 0}
/* painel */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.top .t{display:flex;align-items:center;gap:12px}
.top h1{font-size:18px}.top small{display:block;color:var(--mut);font-size:12px}
.acts{display:flex;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font:700 26px "Space Grotesk",sans-serif;color:var(--gold);line-height:1.1}
.kpi span{color:var(--mut);font-size:12.5px}
.meta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.meta .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px}
.meta .lb b{color:var(--tx)}
.bar{height:8px;background:#0b0a08;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .6s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips span{background:#ffffff08;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;color:#dcd6c8}
.chips span b{color:var(--gold)}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:11px 12px;border-radius:10px;outline:none;width:100%;font-size:15px}
.tools input:focus,.tools select:focus{border-color:var(--gold)}
.list{display:grid;gap:10px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.p h3{font-size:16px;margin-bottom:3px}
.p .d{color:var(--mut);font-size:13px}
.p .d b{color:#dcd6c8;font-weight:500}
.p .r{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:132px}
.wa{display:flex;align-items:center;justify-content:center;gap:6px;background:#25d366;color:#05230f;text-decoration:none;font-weight:600;font-size:13.5px;padding:9px 12px;border-radius:10px}
.st{background:#0b0a08;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 10px;font-size:13.5px;outline:none;cursor:pointer}
.st[data-v="Avisado"]{border-color:#c99a4e;color:var(--gold2)}
.st[data-v="Comprou"]{border-color:#2f7a45;color:#8fd18f}
.st[data-v="Desistiu"]{border-color:#5a2a24;color:#c98b82}
.empty{text-align:center;color:var(--mut);padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
.msg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:#0e0d0b;font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:99px;box-shadow:0 10px 30px #000a;opacity:0;transition:opacity .25s;pointer-events:none}
.msg.on{opacity:1}
@media(max-width:520px){.acts .tx{display:none}.p{grid-template-columns:1fr}.p .r{flex-direction:row}.p .r>*{flex:1}.kpi b{font-size:22px}.top h1{font-size:16px}}
</style>
</head>
<body>
<div class="w">

<section id="login">
<form class="lg" id="fLogin">
<span class="logo">ADR</span>
<h1>Área do administrador</h1>
<p>Lista VIP · acesso só da ADR Nutra</p>
<input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
<button class="btn" type="submit" id="bLogin">Entrar</button>
<p class="er" id="erLogin"></p>
</form>
</section>

<section id="painel" class="hidden">
<div class="top">
<div class="t"><span class="logo">ADR</span><div><h1>Lista VIP</h1><small id="atual">—</small></div></div>
<div class="acts"><button class="ghost" id="bAtual" title="Atualizar" aria-label="Atualizar">↻<span class="tx"> Atualizar</span></button><button class="ghost" id="bSair">Sair</button></div>
</div>
<div class="kpis">
<div class="kpi"><b id="kTotal">0</b><span>inscritos</span></div>
<div class="kpi"><b id="kPotes">0</b><span>potes desejados</span></div>
<div class="kpi"><b id="kComprou">0</b><span>já compraram</span></div>
</div>
<div class="meta"><div class="lb"><span>Meta da lista</span><span><b id="mTxt">0</b> de 50 pessoas</span></div><div class="bar"><i id="mBar" style="width:0"></i></div></div>
<div class="chips" id="chips"></div>
<div class="tools">
<input id="busca" placeholder="Buscar por nome, cidade ou número">
<select id="filtro"><option value="">Todos</option><option>Aguardando</option><option>Avisado</option><option>Comprou</option><option>Desistiu</option></select>
</div>
<div class="list" id="lista"></div>
<p style="text-align:center;margin-top:18px"><button class="ghost" id="bCsv">⬇ Baixar lista (planilha)</button></p>
</section>

</div>
<div class="msg" id="msg"></div>
<script>
/* Mesmo link /exec usado na página vip.html */
const VIP_URL="";
const META=50;
const $=id=>document.getElementById(id);
let senha="",pessoas=[];
try{senha=sessionStorage.getItem("adrVipSenha")||""}catch(e){}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aviso=t=>{const m=$("msg");m.textContent=t;m.classList.add("on");clearTimeout(aviso.t);aviso.t=setTimeout(()=>m.classList.remove("on"),2200)};
async function api(params){
 if(!VIP_URL)throw new Error("semurl");
 const u=VIP_URL+"?"+new URLSearchParams({...params,senha}).toString();
 const r=await fetch(u);return r.json();
}
async function carregar(primeira){
 try{
  const d=await api({acao:"lista"});
  if(!d.ok){if(d.erro==="senha"){sair();$("erLogin").textContent="Senha incorreta.";return}throw new Error(d.erro)}
  pessoas=d.pessoas.reverse();
  try{sessionStorage.setItem("adrVipSenha",senha)}catch(e){}
  $("login").classList.add("hidden");$("painel").classList.remove("hidden");
  $("atual").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  render();if(!primeira)aviso("Lista atualizada");
 }catch(e){
  if(!$("painel").classList.contains("hidden"))aviso("Sem conexão. Tente de novo.");
  else $("erLogin").textContent=e.message==="semurl"?"A planilha ainda não foi conectada.":"Não foi possível conectar. Tente de novo.";
 }finally{$("bLogin").disabled=false;$("bLogin").textContent="Entrar"}
}
const qtd=p=>/3/.test(p)?3:(parseInt(p,10)||1);
function render(){
 const total=pessoas.length;
 $("kTotal").textContent=total;
 $("kPotes").textContent=pessoas.filter(p=>p.status!=="Desistiu").reduce((a,p)=>a+qtd(p.potes),0)+(pessoas.some(p=>/3/.test(p.potes))?"+":"");
 $("kComprou").textContent=pessoas.filter(p=>p.status==="Comprou").length;
 $("mTxt").textContent=total;$("mBar").style.width=Math.min(100,total/META*100)+"%";
 const cid={};pessoas.forEach(p=>cid[p.cidade]=(cid[p.cidade]||0)+1);
 $("chips").innerHTML=Object.entries(cid).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<span>${esc(c)} <b>${n}</b></span>`).join("");
 const b=$("busca").value.trim().toLowerCase(),bd=b.replace(/\D/g,""),f=$("filtro").value;
 const vis=pessoas.filter(p=>(!f||p.status===f)&&(!b||(p.nome+" "+p.cidade).toLowerCase().includes(b)||(bd&&p.whatsapp.replace(/\D/g,"").includes(bd))));
 $("lista").innerHTML=vis.length?vis.map(p=>{const dig=p.whatsapp.replace(/\D/g,""),txt=encodeURIComponent("Oi, "+p.nome.split(" ")[0]+"! Aqui é da ADR Nutra 💛");
 return `<div class="p"><div><h3>${esc(p.nome)}</h3><div class="d"><b>${esc(p.whatsapp)}</b> · ${esc(p.cidade)} · ${esc(p.potes)} pote${qtd(p.potes)>1?"s":""}</div><div class="d">Inscrito em ${esc(p.data)}</div></div><div class="r"><a class="wa" href="https://wa.me/55${dig}?text=${txt}" target="_blank" rel="noopener">💬 WhatsApp</a><select class="st" data-l="${p.linha}" data-v="${esc(p.status)}">${["Aguardando","Avisado","Comprou","Desistiu"].map(s=>`<option${s===p.status?" selected":""}>${s}</option>`).join("")}</select></div></div>`}).join(""):`<div class="empty">${total?"Ninguém encontrado com esse filtro.":"Ainda ninguém na lista. Divulgue o link adr-suplementos.pages.dev/vip 💛"}</div>`;
}
$("lista").addEventListener("change",async e=>{const s=e.target.closest(".st");if(!s)return;const l=+s.dataset.l,v=s.value,p=pessoas.find(x=>x.linha===l),antes=p.status;
 p.status=v;s.dataset.v=v;render();
 try{const d=await api({acao:"status",linha:l,valor:v});if(!d.ok)throw 0;aviso(p.nome.split(" ")[0]+": "+v)}catch(_){p.status=antes;render();aviso("Não salvou. Tente de novo.")}});
$("busca").addEventListener("input",render);$("filtro").addEventListener("change",render);
$("bAtual").addEventListener("click",()=>carregar(false));
function sair(){senha="";try{sessionStorage.removeItem("adrVipSenha")}catch(e){}pessoas=[];$("painel").classList.add("hidden");$("login").classList.remove("hidden");$("senha").value=""}
$("bSair").addEventListener("click",sair);
$("fLogin").addEventListener("submit",e=>{e.preventDefault();senha=$("senha").value;if(!senha){$("erLogin").textContent="Digite a senha.";return}$("erLogin").textContent="";$("bLogin").disabled=true;$("bLogin").textContent="Entrando...";carregar(true)});
$("bCsv").addEventListener("click",()=>{const linhas=[["Data","Nome","WhatsApp","Cidade","Potes","Status"],...pessoas.map(p=>[p.data,p.nome,p.whatsapp,p.cidade,p.potes,p.status])];
 const csv="﻿"+linhas.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="lista-vip-adr.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
if(senha)carregar(true);
</script>
</body>
</html>
